<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ NEGOCIO.nome }}{% endblock %}</title>
  <meta name="description" content="{% block descricao %}{% endblock %}">
  <meta name="theme-color" content="#3b2320">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ self.titulo() }}">
  <meta property="og:description" content="{{ self.descricao() }}">
  <meta property="og:locale" content="pt_BR">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
{% block corpo %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
